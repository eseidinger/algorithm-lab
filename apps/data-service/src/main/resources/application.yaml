spring:
  application:
    name: data-service

  datasource:
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:algorithm_lab}?currentSchema=catalog
    username: ${PGUSER:catalog_app}
    password: ${PGPASSWORD}

  flyway:
    default-schema: catalog
    schemas: catalog
    create-schemas: false

server:
  port: ${PORT:8080}

management:
  endpoint:
    health:
      probes:
        enabled: true
